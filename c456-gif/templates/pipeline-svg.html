<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:750px; height:420px; overflow:hidden;
    font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:#fafaf9; -webkit-font-smoothing:antialiased; }
  svg { display:block; }
</style>
</head>
<body>
<svg id="c" width="750" height="420" viewBox="0 0 750 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fa9704" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#fa9704" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1c1917" flood-opacity=".10"/>
    </filter>
  </defs>

  <!-- 点阵 -->
  <g id="dots" opacity="0">
    <pattern id="pt" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#e6e3de"/>
    </pattern>
    <rect width="750" height="420" fill="url(#pt)"/>
  </g>

  <!-- 顶部标题 -->
  <g id="head" opacity="0">
    <text x="40" y="52" font-size="11" letter-spacing="3" fill="#b0aaa3" font-weight="600">AI 短剧 · 一条流水线</text>
    <text id="htitle" x="40" y="84" font-size="25" font-weight="700" fill="#1c1917">六道工序，<tspan fill="#fa9704">才出一集</tspan></text>
  </g>

  <!-- 传送带 -->
  <g id="belt" opacity="0">
    <rect id="beltline" x="35" y="338" width="0" height="5" rx="2.5" fill="#ddd8d1"/>
    <g id="rollers" opacity="0" stroke="#d3cdc5" stroke-width="2" stroke-linecap="round">
      <line x1="70" y1="344" x2="70" y2="350"/><line x1="130" y1="344" x2="130" y2="350"/>
      <line x1="190" y1="344" x2="190" y2="350"/><line x1="250" y1="344" x2="250" y2="350"/>
      <line x1="310" y1="344" x2="310" y2="350"/><line x1="370" y1="344" x2="370" y2="350"/>
      <line x1="430" y1="344" x2="430" y2="350"/><line x1="490" y1="344" x2="490" y2="350"/>
      <line x1="550" y1="344" x2="550" y2="350"/><line x1="610" y1="344" x2="610" y2="350"/>
      <line x1="670" y1="344" x2="670" y2="350"/>
    </g>
  </g>

  <!-- 六个工位 -->
  <g id="st0" opacity="0">
    <rect x="-34" y="-46" width="68" height="46" rx="10" fill="#fff" stroke="#e7e5e4" stroke-width="1.6" filter="url(#soft)"/>
    <g id="ic0" stroke="#c9c4bd" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-9" y="-36" width="18" height="24" rx="3"/>
      <path d="M-5 -30h10M-5 -25h10M-5 -20h6"/>
    </g>
    <text x="0" y="-9" font-size="10.5" text-anchor="middle" fill="#a8a29e" font-weight="600">剧本</text>
  </g>
  <g id="st1" opacity="0">
    <rect x="-34" y="-46" width="68" height="46" rx="10" fill="#fff" stroke="#e7e5e4" stroke-width="1.6" filter="url(#soft)"/>
    <g id="ic1" stroke="#c9c4bd" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-8" cy="-31" r="3"/><circle cx="8" cy="-31" r="3"/><circle cx="0" cy="-31" r="3"/>
      <path d="M-13 -19c0-2.2 1.6-4 3.5-4s3.5 1.8 3.5 4"/>
      <path d="M3 -19c0-2.2 1.6-4 3.5-4s3.5 1.8 3.5 4"/>
    </g>
    <text x="0" y="-9" font-size="10.5" text-anchor="middle" fill="#a8a29e" font-weight="600">定妆</text>
  </g>
  <g id="st2" opacity="0">
    <rect x="-34" y="-46" width="68" height="46" rx="10" fill="#fff" stroke="#e7e5e4" stroke-width="1.6" filter="url(#soft)"/>
    <g id="ic2" stroke="#c9c4bd" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-13" y="-37" width="26" height="22" rx="3"/>
      <path d="M-4.5 -37v22M4.5 -37v22M-13 -28h26M-13 -19h26"/>
    </g>
    <text x="0" y="-9" font-size="10.5" text-anchor="middle" fill="#a8a29e" font-weight="600">分镜</text>
  </g>
  <g id="st3" opacity="0">
    <rect x="-34" y="-46" width="68" height="46" rx="10" fill="#fff" stroke="#e7e5e4" stroke-width="1.6" filter="url(#soft)"/>
    <g id="ic3" stroke="#c9c4bd" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-13" y="-37" width="26" height="22" rx="3"/>
      <path d="M-4 -31l7 5-7 5z"/>
    </g>
    <text x="0" y="-9" font-size="10.5" text-anchor="middle" fill="#a8a29e" font-weight="600">出画面</text>
  </g>
  <g id="st4" opacity="0">
    <rect x="-34" y="-46" width="68" height="46" rx="10" fill="#fff" stroke="#e7e5e4" stroke-width="1.6" filter="url(#soft)"/>
    <g id="ic4" stroke="#c9c4bd" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14 -26h4l3-6 3 12 2.5-8 2 2h3.5"/>
    </g>
    <text x="0" y="-9" font-size="10.5" text-anchor="middle" fill="#a8a29e" font-weight="600">声音配乐</text>
  </g>
  <g id="st5" opacity="0">
    <rect x="-34" y="-46" width="68" height="46" rx="10" fill="#fff" stroke="#e7e5e4" stroke-width="1.6" filter="url(#soft)"/>
    <g id="ic5" stroke="#c9c4bd" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-13" y="-37" width="14" height="6" rx="1.6"/>
      <rect x="-6" y="-29" width="18" height="6" rx="1.6"/>
      <rect x="-11" y="-21" width="11" height="6" rx="1.6"/>
    </g>
    <text x="0" y="-9" font-size="10.5" text-anchor="middle" fill="#a8a29e" font-weight="600">剪辑质检</text>
  </g>

  <!-- 传送物：六种形态 -->
  <g id="item" opacity="0">
    <ellipse cx="0" cy="22" rx="34" ry="4" fill="#1c1917" opacity=".07"/>

    <!-- 形态1：剧本纸 -->
    <g id="f1">
      <rect x="-28" y="-20" width="56" height="40" rx="4" fill="#fff" stroke="#1c1917" stroke-width="2"/>
      <g id="plines" stroke="#c9c4bd" stroke-width="1.8" stroke-linecap="round" opacity="0">
        <line x1="-20" y1="-11" x2="20" y2="-11"/>
        <line x1="-20" y1="-4" x2="20" y2="-4"/>
        <line x1="-20" y1="3" x2="14" y2="3"/>
        <line x1="-20" y1="10" x2="18" y2="10"/>
      </g>
    </g>

    <!-- 形态2：三视图人物卡 -->
    <g id="f2" opacity="0">
      <g transform="translate(-34,-2) scale(.9)">
        <rect x="-13" y="-22" width="26" height="34" rx="4" fill="#fff" stroke="#1c1917" stroke-width="1.8"/>
        <circle cx="0" cy="-10" r="4.5" fill="none" stroke="#1c1917" stroke-width="1.6"/>
        <path d="M-7 6c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5" fill="none" stroke="#1c1917" stroke-width="1.6"/>
      </g>
      <g transform="translate(0,-8) scale(1.05)">
        <rect x="-13" y="-22" width="26" height="34" rx="4" fill="#fff" stroke="#fa9704" stroke-width="2"/>
        <circle cx="0" cy="-10" r="4.5" fill="none" stroke="#1c1917" stroke-width="1.6"/>
        <path d="M-7 6c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5" fill="none" stroke="#1c1917" stroke-width="1.6"/>
      </g>
      <g transform="translate(34,-2) scale(.9)">
        <rect x="-13" y="-22" width="26" height="34" rx="4" fill="#fff" stroke="#1c1917" stroke-width="1.8"/>
        <circle cx="0" cy="-10" r="4.5" fill="none" stroke="#1c1917" stroke-width="1.6"/>
        <path d="M-7 6c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5" fill="none" stroke="#1c1917" stroke-width="1.6"/>
      </g>
    </g>

    <!-- 形态3：九宫格 -->
    <g id="f3" opacity="0">
      <g fill="#fff" stroke="#1c1917" stroke-width="1.6">
        <rect x="-32" y="-32" width="20" height="20" rx="3"/>
        <rect x="-10" y="-32" width="20" height="20" rx="3"/>
        <rect x="12" y="-32" width="20" height="20" rx="3"/>
        <rect x="-32" y="-10" width="20" height="20" rx="3"/>
        <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#fa9704" stroke="#fa9704"/>
        <rect x="12" y="-10" width="20" height="20" rx="3"/>
        <rect x="-32" y="12" width="20" height="20" rx="3"/>
        <rect x="-10" y="12" width="20" height="20" rx="3"/>
        <rect x="12" y="12" width="20" height="20" rx="3"/>
      </g>
    </g>

    <!-- 形态4：画面框 -->
    <g id="f4" opacity="0">
      <rect x="-40" y="-26" width="80" height="52" rx="5" fill="#fff" stroke="#1c1917" stroke-width="2.2"/>
      <path d="M-8 -10l16 10-16 10z" fill="#fa9704"/>
      <line x1="-40" y1="18" x2="40" y2="18" stroke="#e7e5e4" stroke-width="3"/>
      <line x1="-40" y1="18" x2="10" y2="18" stroke="#fa9704" stroke-width="3"/>
    </g>

    <!-- 形态5：声音 -->
    <g id="f5" opacity="0">
      <rect x="-40" y="-24" width="80" height="48" rx="5" fill="#fff" stroke="#1c1917" stroke-width="2"/>
      <g id="wave" stroke="#fa9704" stroke-width="2.6" stroke-linecap="round">
        <line x1="-28" y1="0" x2="-28" y2="0"/>
        <line x1="-20" y1="0" x2="-20" y2="0"/>
        <line x1="-12" y1="0" x2="-12" y2="0"/>
        <line x1="-4" y1="0" x2="-4" y2="0"/>
        <line x1="4" y1="0" x2="4" y2="0"/>
        <line x1="12" y1="0" x2="12" y2="0"/>
        <line x1="20" y1="0" x2="20" y2="0"/>
        <line x1="28" y1="0" x2="28" y2="0"/>
      </g>
    </g>

    <!-- 形态6：成品 -->
    <g id="f6" opacity="0">
      <rect x="-34" y="-30" width="68" height="60" rx="6" fill="#fff" stroke="#1c1917" stroke-width="2.2"/>
      <rect x="-26" y="-22" width="52" height="28" rx="3" fill="#f4f1ec"/>
      <path d="M-24 20l6-8 5 5 7-9 10 12z" fill="#c9c4bd"/>
      <circle id="checkbg" cx="20" cy="18" r="9" fill="#fa9704"/>
      <path d="M15.5 18.2l3 3.2 6-6.4" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- 光晕 + 收尾 -->
  <circle id="halo" cx="375" cy="150" r="150" fill="url(#glow)" opacity="0"/>
  <g id="final" opacity="0">
    <text x="375" y="150" font-size="27" font-weight="700" text-anchor="middle" fill="#1c1917">六道工序串起来</text>
    <text x="375" y="188" font-size="27" font-weight="700" text-anchor="middle" fill="#fa9704">就是一间自动化后厨</text>
  </g>
</svg>

<script>
const $ = id => document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,s,e)=>clamp((t-s)/(e-s));
const outC=t=>1-Math.pow(1-t,3);
const inOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const outBack=t=>{const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

const DURATION = 20;
const SX = [90, 205, 320, 435, 550, 665];     // 六个工位 x
const BELT_Y = 338;
const ITEM_Y = 306;                            // 传送物中心

// 传送物 x：分段移动，停靠时不动
const MOVE = [
  [2.6, 4.2, -70, SX[0]],
  [5.2, 6.0, SX[0], SX[1]],
  [7.6, 8.4, SX[1], SX[2]],
  [10.0,10.8, SX[2], SX[3]],
  [12.4,13.2, SX[3], SX[4]],
  [14.8,15.6, SX[4], SX[5]]
];
function itemX(t){
  let x = -70;
  for(const [s,e,a,b] of MOVE){
    const p = inOut(seg(t,s,e));
    if(t >= s) x = a + (b-a)*p;
  }
  return x;
}
// 工位到达时刻
const HIT = [4.2, 6.0, 8.4, 10.8, 13.2, 15.6];

window.render = function(t){
  t = t * DURATION;

  $('dots').setAttribute('opacity', (seg(t,0,0.9)*0.9).toFixed(3));
  $('head').setAttribute('opacity', outC(seg(t,0.1,0.9)));

  // 传送带展开
  const bp = outC(seg(t,0.3,1.6));
  $('beltline').setAttribute('width', (680*bp).toFixed(1));
  $('rollers').setAttribute('opacity', seg(t,1.2,1.8));

  // 工位依次升起
  for(let i=0;i<6;i++){
    const s0 = 1.5 + i*0.16;
    const p = outBack(seg(t,s0,s0+0.7));
    const el = $('st'+i);
    el.setAttribute('opacity', seg(t,s0,s0+0.2));
    el.setAttribute('transform', `translate(${SX[i]},${(390 + (1-p)*34).toFixed(1)})`);

    // 点亮
    const hit = outC(seg(t, HIT[i], HIT[i]+0.45));
    const rect = el.querySelector('rect');
    const ic = $('ic'+i);
    const txt = el.querySelector('text');
    rect.setAttribute('stroke', hit>0.4 ? '#f2d3a6' : '#e7e5e4');
    ic.setAttribute('stroke', hit>0.35 ? '#fa9704' : '#c9c4bd');
    txt.setAttribute('fill', hit>0.4 ? '#1c1917' : '#a8a29e');
  }

  // 传送物
  const ix = itemX(t);
  const bob = Math.sin(t*6)*1.2*seg(t,2.6,3.2)*(t<15.8?1:0);
  const enter = outBack(seg(t,2.6,3.4));
  $('item').setAttribute('opacity', seg(t,2.6,2.9));
  $('item').setAttribute('transform',
    `translate(${ix.toFixed(2)},${(ITEM_Y+bob).toFixed(2)}) rotate(${((1-enter)*-8).toFixed(1)})`);

  // 形态切换
  const show = (id, on) => $(id).setAttribute('opacity', on.toFixed(3));
  show('f1', outC(seg(t,2.9,3.4)) * (1-outC(seg(t,5.2,5.6))));
  show('f2', outC(seg(t,5.6,6.3)) * (1-outC(seg(t,7.6,8.0))));
  show('f3', outC(seg(t,8.0,8.7)) * (1-outC(seg(t,10.0,10.4))));
  show('f4', outC(seg(t,10.4,11.0)) * (1-outC(seg(t,12.4,12.8))));
  show('f5', outC(seg(t,12.8,13.4)) * (1-outC(seg(t,14.8,15.2))));
  show('f6', outC(seg(t,15.4,16.2)));

  // 剧本阶段：字迹一行行出现
  const lines = $('plines').children;
  for(let i=0;i<4;i++){
    lines[i].setAttribute('opacity', seg(t,3.4+i*0.35,3.7+i*0.35).toFixed(2));
  }

  // 波形跳动
  const wv = $('wave').children;
  for(let i=0;i<8;i++){
    const h = 6 + 13*Math.abs(Math.sin(t*4.4 + i*0.7));
    wv[i].setAttribute('y1', (-h/2).toFixed(1));
    wv[i].setAttribute('y2', (h/2).toFixed(1));
  }

  // 收尾
  const fp = outC(seg(t,17.2,18.4));
  $('halo').setAttribute('opacity', fp*0.95);
  $('final').setAttribute('opacity', fp);
  const fa = $('final').children[0], fb = $('final').children[1];
  fa.setAttribute('opacity', outC(seg(t,17.2,18.0)));
  fb.setAttribute('opacity', outC(seg(t,17.9,18.7)));
  fa.setAttribute('y', (150 + 6*(1-outC(seg(t,17.2,18.0)))).toFixed(1));
  fb.setAttribute('y', (188 + 6*(1-outC(seg(t,17.9,18.7)))).toFixed(1));
};
render(0);
</script>
</body>
</html>
