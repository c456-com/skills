<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
__FONT_FACES__
      :root {
        --bg: __BG__;
        --ink: __INK__;
        --accent: __ACCENT__;
        --muted: __MUTED__;
        --ts: __TITLE_SIZE__;
        --ss: __SUB_SIZE__;
        --ls: __LABEL_SIZE__;
        --vs: __VOL_SIZE__;
        __DOTS_VAR__
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 460px; overflow: hidden;
        background: var(--bg); color: var(--ink);
        font-family: "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #cover { position: relative; width: 1080px; height: 460px; overflow: hidden; background: var(--bg); }

      .dots { position: absolute; inset: 0;
        background-image: radial-gradient(var(--dots-color, color-mix(in srgb, var(--ink) 9%, transparent)) 1.2px, transparent 1.2px);
        background-size: 22px 22px; opacity: .85; }

      .topbar { position: absolute; left: 64px; top: 46px; right: 64px;
        display: flex; align-items: center; justify-content: space-between; }
      .col { display: flex; align-items: center; gap: 12px; }
      .colno { width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
        color: #fff; font-size: 15px; font-weight: 700; text-align: center; line-height: 34px; }
      .colname { font-size: var(--ls); font-weight: 600; letter-spacing: .26em; color: var(--muted); }
      .vol { font-size: var(--vs); letter-spacing: .18em; color: var(--muted); font-weight: 600; opacity: .8; }

      .title { position: absolute; left: 64px; top: 118px; width: 660px;
        font-size: var(--ts); font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
      .title em { font-style: normal; color: var(--accent); }

      .sub { position: absolute; left: 64px; top: 300px; width: 630px;
        font-size: var(--ss); line-height: 1.6; color: var(--muted); }

      .brandline { position: absolute; left: 64px; bottom: 52px; width: 96px; height: 7px;
        background: var(--accent); border-radius: 4px; }
      .brand { position: absolute; left: 176px; bottom: 46px; font-size: 15px;
        letter-spacing: .16em; color: var(--muted); font-weight: 600; opacity: .85; }

      .artbg { position: absolute; right: 24px; top: 56px; width: 344px; height: 344px;
        border-radius: 50%; background: color-mix(in srgb, var(--accent) 10%, transparent); }
      .art { position: absolute; right: 46px; top: 78px; width: 300px; height: 300px; }
      .art img { width: 100%; height: 100%; display: block; }

      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="cover">
      <div class="dots" id="d-dots"></div>
      <div class="artbg" id="d-blob"></div>

      <div class="topbar">
        <div class="col">
          <div class="colno">__NO__</div>
          <div class="colname">__LABEL__</div>
        </div>
        <div class="vol">__VOL__</div>
      </div>

      <div class="title">__TITLE__</div>
      <div class="sub">__SUB__</div>

      <div class="brandline" id="d-brandline"></div>
      <div class="brand">__BRAND__</div>

      <div class="art"><img src="__ART__" alt="" /></div>
    </div>
  </body>
</html>
