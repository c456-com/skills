# ~/.config/skills/doc-driven-multi-agent/team-config.yaml
# Auto-generated by doc-driven-multi-agent onboarding.
# Edit this file to update your team configuration (global, shared across all your projects).
# Per-project override: place .skills/team-config.local.yaml in your project root.
#
# Copy this file to ~/.config/skills/doc-driven-multi-agent/team-config.yaml,
# then edit the values below.

version: "1.0"
team_name: "<your-team-name>"
created: "<YYYY-MM-DDT HH:MM TZ>"
last_used: "<YYYY-MM-DDT HH:MM TZ>"

# ── Roles ──────────────────────────────────────────────────────
# Set enabled: false for roles your team doesn't use.
roles:
  project_manager:
    enabled: true
    played_by: "<who plays this role>"
    agent_type: "hermes"             # hermes | cursor-agent | claude-code | copilot | human
    session_template: ""             # e.g. "cursor-pm-{task}" for tmux
    notes: ""

  product_owner:
    enabled: true
    played_by: ""
    agent_type: ""
    session_template: ""
    notes: ""

  architect:
    enabled: true
    played_by: ""
    agent_type: ""
    session_template: ""
    notes: ""

  developer:
    enabled: true
    played_by: ""
    agent_type: ""
    session_template: ""
    notes: ""

  data_analyst:
    enabled: false
    played_by: ""
    agent_type: ""
    session_template: ""
    notes: ""

# ── Document Paths ──────────────────────────────────────────────
document_paths:
  root: "."
  workflow: "docs/ops/"
  product: "docs/product/"
  specs: "docs/superpowers/specs/"
  comms: "docs/superpowers/comms/"
  plans: "docs/superpowers/plans/"
  reviews: "docs/superpowers/reviews/"
  daily: "docs/ops/daily/"
  worktrees: ".worktrees/"

# ── Feature Slug ────────────────────────────────────────────────
feature_slug_pattern: "{tag}-{date}"

# ── Handoff Chain ───────────────────────────────────────────────
handoff_chain:
  - "po"
  - "pm"
  - "arch"
  - "dev"
  - "arch"
  - "analyst"
  - "po"
  - "pm"

# ── Engineering ─────────────────────────────────────────────────
engineering:
  use_worktrees: true
  preferred_ci: "make ci"
  timestamp_tz: "Asia/Shanghai"
