# ~/.config/skills/doc-driven-multi-agent/team-config.yaml
# 由 doc-driven-multi-agent onboarding 自动生成。
# 编辑此文件可更新团队配置（全局配置，跨项目共享）。
# 项目级覆盖：在项目根目录放置 .skills/team-config.local.yaml。
#
# 可将此文件复制到 ~/.config/skills/doc-driven-multi-agent/team-config.yaml，
# 然后编辑下面的值。

version: "1.0"
team_name: "<你的团队名称>"
created: "<YYYY-MM-DDT HH:MM TZ>"
last_used: "<YYYY-MM-DDT HH:MM TZ>"

# ── 角色 ──────────────────────────────────────────────────────
# 团队不用的角色设为 enabled: false。
roles:
  project_manager:
    enabled: true
    played_by: "<谁扮演这个角色>"
    agent_type: "hermes"             # hermes | cursor-agent | claude-code | copilot | human
    session_template: ""             # 例如 tmux 使用 "cursor-pm-{task}"
    notes: ""

  product_owner:
    enabled: true
    played_by: ""
    agent_type: ""
    session_template: ""
    notes: ""

  architect:
    enabled: true
    played_by: ""
    agent_type: ""
    session_template: ""
    notes: ""

  developer:
    enabled: true
    played_by: ""
    agent_type: ""
    session_template: ""
    notes: ""

  data_analyst:
    enabled: false
    played_by: ""
    agent_type: ""
    session_template: ""
    notes: ""

# ── 文档路径 ───────────────────────────────────────────────────
document_paths:
  root: "."
  workflow: "docs/ops/"
  product: "docs/product/"
  specs: "docs/superpowers/specs/"
  comms: "docs/superpowers/comms/"
  plans: "docs/superpowers/plans/"
  reviews: "docs/superpowers/reviews/"
  daily: "docs/ops/daily/"
  worktrees: ".worktrees/"

# ── Feature Slug ────────────────────────────────────────────────
feature_slug_pattern: "{tag}-{date}"

# ── Handoff 链路 ───────────────────────────────────────────────
handoff_chain:
  - "po"
  - "pm"
  - "arch"
  - "dev"
  - "arch"
  - "analyst"
  - "po"
  - "pm"

# ── 工程偏好 ───────────────────────────────────────────────────
engineering:
  use_worktrees: true
  preferred_ci: "make ci"
  timestamp_tz: "Asia/Shanghai"
